<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>点群ビューア - higashiikuta</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #111; font-family: -apple-system, "Segoe UI", sans-serif; }
  #container { position: absolute; inset: 0; }
  #overlay {
    position: absolute; top: 12px; left: 12px; z-index: 10;
    background: rgba(20,20,20,0.8); color: #eee; padding: 10px 14px;
    border-radius: 8px; font-size: 13px; line-height: 1.6; width: 300px;
    backdrop-filter: blur(4px);
  }
  #overlay b { color: #fff; }
  #overlay hr { border: none; border-top: 1px solid #444; margin: 8px 0; }
  .row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .row label { flex: 0 0 auto; color: #ccc; font-size: 12px; }
  .row input[type=range] { flex: 1 1 auto; }
  .sizeVal { width: 44px; text-align: right; font-family: monospace; font-size: 12px; color: #9cf; }
  button {
    background: #2a2a2a; color: #eee; border: 1px solid #555; border-radius: 6px;
    padding: 5px 10px; font-size: 12px; cursor: pointer;
  }
  button:hover { background: #383838; }
  button.active { background: #2f6fb3; border-color: #4a90d9; color: #fff; }
  #measureList { max-height: 120px; overflow-y: auto; font-family: monospace; font-size: 12px; margin-top: 6px; }
  #measureList div { display: flex; justify-content: space-between; padding: 1px 0; color: #ddd; }
  #loading {
    position: absolute; inset: 0; z-index: 30; display: flex;
    align-items: center; justify-content: center; color: #eee;
    background: rgba(0,0,0,0.6); font-size: 15px;
  }
  #loading.hide { display: none; }
  #stats {
    position: absolute; bottom: 10px; left: 12px; z-index: 10;
    color: #999; font-size: 12px; font-family: monospace;
  }
  .measureLabel {
    position: absolute; z-index: 15; transform: translate(-50%, -100%);
    background: rgba(255, 210, 0, 0.9); color: #111; font-weight: 600;
    font-size: 12px; padding: 2px 6px; border-radius: 4px; white-space: nowrap;
    pointer-events: none;
  }
  #selectionBox {
    position: absolute; z-index: 12; border: 1px dashed #ff5050;
    background: rgba(255, 80, 80, 0.15); pointer-events: none; display: none;
  }
  #deleteCount { font-size: 12px; color: #ff8080; }
</style>
</head>
<body>
<div id="container"></div>

<div id="overlay">
  <div><b>点群ビューア</b></div>
  <div>左ドラッグ: 回転 / 右ドラッグ: 移動 / ホイール: ズーム</div>
  <div id="pointInfo">読み込み中...</div>
  <hr>
  <div class="row">
    <label>点サイズ</label>
    <input type="range" id="sizeSlider" min="1" max="100" value="30">
    <span class="sizeVal" id="sizeVal">-</span>
  </div>
  <hr>
  <div class="row">
    <button id="measureBtn">📏 距離測定: OFF</button>
    <button id="clearBtn">クリア</button>
  </div>
  <div id="measureHint" style="color:#999; font-size:11px; display:none;">
    点群上を2回クリックして2点間の距離を測定します
  </div>
  <div id="measureList"></div>
  <hr>
  <div class="row">
    <button id="deleteModeBtn">🗑️ 範囲削除選択: OFF</button>
  </div>
  <div id="deleteHint" style="color:#999; font-size:11px; display:none;">
    ドラッグで範囲選択(複数回可)。赤い点が削除対象です
  </div>
  <div class="row" id="deleteRow" style="display:none;">
    <span id="deleteCount">選択: 0点</span>
    <button id="deleteConfirmBtn">削除実行</button>
    <button id="deleteClearBtn">選択解除</button>
  </div>
  <div class="row">
    <button id="resetBtn">↺ 元に戻す</button>
    <button id="downloadBtn">💾 編集済みPLYを保存</button>
  </div>
</div>

<div id="selectionBox"></div>

<div id="stats"></div>

<div id="loading">点群を読み込み中...</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';

const PLY_FILE = 'higashiikuta_light_8cm.ply';

const loading = document.getElementById('loading');
const pointInfo = document.getElementById('pointInfo');
const statsEl = document.getElementById('stats');
const sizeSlider = document.getElementById('sizeSlider');
const sizeVal = document.getElementById('sizeVal');
const measureBtn = document.getElementById('measureBtn');
const clearBtn = document.getElementById('clearBtn');
const measureHint = document.getElementById('measureHint');
const measureList = document.getElementById('measureList');
const deleteModeBtn = document.getElementById('deleteModeBtn');
const deleteHint = document.getElementById('deleteHint');
const deleteRow = document.getElementById('deleteRow');
const deleteCount = document.getElementById('deleteCount');
const deleteConfirmBtn = document.getElementById('deleteConfirmBtn');
const deleteClearBtn = document.getElementById('deleteClearBtn');
const resetBtn = document.getElementById('resetBtn');
const downloadBtn = document.getElementById('downloadBtn');
const selectionBox = document.getElementById('selectionBox');

let scene, camera, renderer, controls, pointCloud, raycaster;
let sceneScale = 1; // バウンディングスフィア半径。サイズ調整の基準にする
let measureMode = false;
let pendingPoint = null;   // 測定中の1点目
let pendingMarker = null;

let originalBuffer = null;   // リセット用に保持する読み込み直後のArrayBuffer
let originalLabel = '';
let deleteMode = false;
let baseColors = null;       // ハイライト前の元の色 (Float32Array)
let selectedMask = null;     // Uint8Array: 1 = 削除候補として選択中
const measurements = [];     // {a, b, markerA, markerB, line, label, dist}

function createCircleTexture() {
  const size = 64;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  grad.addColorStop(0.0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.75, 'rgba(255,255,255,1)');
  grad.addColorStop(1.0, 'rgba(255,255,255,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(canvas);
}
const circleTexture = createCircleTexture();

function initScene() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111111);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 10000);
  camera.position.set(0, 0, 5);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.getElementById('container').appendChild(renderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;

  raycaster = new THREE.Raycaster();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  setupMeasurement();
  setupDeleteSelection();
  animate();
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
  updateAllLabels();
}

function loadPlyArrayBuffer(arrayBuffer, label, keepAsOriginal = true) {
  if (keepAsOriginal) {
    originalBuffer = arrayBuffer.slice(0);
    originalLabel = label;
  }

  const loader = new PLYLoader();
  const geometry = loader.parse(arrayBuffer);
  geometry.computeBoundingBox();
  geometry.computeBoundingSphere();

  if (pointCloud) {
    scene.remove(pointCloud);
    pointCloud.geometry.dispose();
    pointCloud.material.dispose();
  }
  clearMeasurements();
  exitDeleteMode();

  const hasColor = !!geometry.getAttribute('color');
  const material = new THREE.PointsMaterial({
    sizeAttenuation: true,
    vertexColors: true,
    map: circleTexture,
    alphaTest: 0.4,
    transparent: false,
  });

  // PLYLoaderは0-255のuint8色を0-1に正規化しないことがあるため補正
  // 色情報が無いPLYの場合は選択ハイライト用に一様なグレーの色属性を作る
  const colorAttr = geometry.getAttribute('color');
  const posCount = geometry.getAttribute('position').count;
  if (colorAttr && colorAttr.array instanceof Uint8Array) {
    const normalized = new Float32Array(colorAttr.array.length);
    for (let i = 0; i < colorAttr.array.length; i++) {
      normalized[i] = colorAttr.array[i] / 255;
    }
    geometry.setAttribute('color', new THREE.BufferAttribute(normalized, 3));
  } else if (!hasColor) {
    const gray = new Float32Array(posCount * 3).fill(0.706);
    geometry.setAttribute('color', new THREE.BufferAttribute(gray, 3));
  }

  baseColors = geometry.getAttribute('color').array.slice(0);
  selectedMask = new Uint8Array(posCount);

  pointCloud = new THREE.Points(geometry, material);

  // 中心をシーン原点へ、カメラをバウンディングスフィアに合わせて配置
  geometry.center();

  const sphere = geometry.boundingSphere;
  sceneScale = sphere ? sphere.radius : 5;
  const dist = sceneScale * 2.2;
  camera.position.set(dist * 0.5, dist * 0.3, dist);
  camera.near = Math.max(dist / 2000, 0.001);
  camera.far = dist * 20;
  camera.updateProjectionMatrix();
  controls.target.set(0, 0, 0);
  controls.update();

  scene.add(pointCloud);

  // 点の見た目サイズをシーン規模に応じて初期化
  sizeSlider.value = 30;
  applyPointSize();

  const count = geometry.getAttribute('position').count;
  pointInfo.textContent = `${label}: ${count.toLocaleString()} 点`;
  statsEl.textContent = `points: ${count.toLocaleString()}`;
  updateDeleteCountUI();
}

function applyPointSize() {
  if (!pointCloud) return;
  const t = sizeSlider.value / 100; // 0.01 - 1.0
  const size = sceneScale * (0.0008 + t * 0.012);
  pointCloud.material.size = size;
  raycaster.params.Points.threshold = size * 1.5;
  sizeVal.textContent = (size * 100).toFixed(1) + 'cm';
}
sizeSlider.addEventListener('input', applyPointSize);

async function loadInitial() {
  try {
    const res = await fetch(PLY_FILE);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const buf = await res.arrayBuffer();
    loadPlyArrayBuffer(buf, PLY_FILE);
  } catch (e) {
    pointInfo.textContent = '読み込みエラー: ' + e.message;
  } finally {
    loading.classList.add('hide');
  }
}

// ------------------------------------------------------------------
// 距離測定機能
// ------------------------------------------------------------------
function setupMeasurement() {
  measureBtn.addEventListener('click', () => {
    if (!measureMode && deleteMode) exitDeleteMode(); // 削除選択モードとは排他
    measureMode = !measureMode;
    measureBtn.textContent = `📏 距離測定: ${measureMode ? 'ON' : 'OFF'}`;
    measureBtn.classList.toggle('active', measureMode);
    measureHint.style.display = measureMode ? 'block' : 'none';
    if (!measureMode) cancelPending();
  });

  clearBtn.addEventListener('click', clearMeasurements);

  let downPos = null;
  renderer.domElement.addEventListener('pointerdown', (e) => {
    downPos = { x: e.clientX, y: e.clientY };
  });
  renderer.domElement.addEventListener('pointerup', (e) => {
    if (!measureMode || !pointCloud || !downPos) { downPos = null; return; }
    const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
    downPos = null;
    if (moved > 5) return; // ドラッグ（回転操作）とみなしクリック扱いしない
    handleMeasureClick(e);
  });
}

function handleMeasureClick(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  const mouse = new THREE.Vector2(
    ((e.clientX - rect.left) / rect.width) * 2 - 1,
    -((e.clientY - rect.top) / rect.height) * 2 + 1
  );
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObject(pointCloud);
  if (hits.length === 0) return;
  const point = hits[0].point.clone();

  if (!pendingPoint) {
    pendingPoint = point;
    pendingMarker = makeMarker(point, 0xff5050);
    scene.add(pendingMarker);
  } else {
    const a = pendingPoint;
    const b = point;
    const markerA = pendingMarker;
    const markerB = makeMarker(b, 0xff5050);
    scene.add(markerB);

    const lineGeom = new THREE.BufferGeometry().setFromPoints([a, b]);
    const line = new THREE.Line(lineGeom, new THREE.LineBasicMaterial({ color: 0xffd200 }));
    scene.add(line);

    const dist = a.distanceTo(b);
    const label = document.createElement('div');
    label.className = 'measureLabel';
    label.textContent = `${dist.toFixed(3)} m`;
    document.body.appendChild(label);

    measurements.push({ a, b, markerA, markerB, line, label, dist });
    renderMeasureList();

    pendingPoint = null;
    pendingMarker = null;
  }
}

function makeMarker(pos, color) {
  const geom = new THREE.SphereGeometry(Math.max(sceneScale / 250, 0.005), 12, 12);
  const mat = new THREE.MeshBasicMaterial({ color });
  const mesh = new THREE.Mesh(geom, mat);
  mesh.position.copy(pos);
  return mesh;
}

function cancelPending() {
  if (pendingMarker) {
    scene.remove(pendingMarker);
    pendingMarker.geometry.dispose();
    pendingMarker.material.dispose();
  }
  pendingPoint = null;
  pendingMarker = null;
}

function clearMeasurements() {
  cancelPending();
  for (const m of measurements) {
    scene.remove(m.markerA, m.markerB, m.line);
    m.markerA.geometry.dispose(); m.markerA.material.dispose();
    m.markerB.geometry.dispose(); m.markerB.material.dispose();
    m.line.geometry.dispose(); m.line.material.dispose();
    m.label.remove();
  }
  measurements.length = 0;
  renderMeasureList();
}

function renderMeasureList() {
  measureList.innerHTML = measurements
    .map((m, i) => `<div><span>#${i + 1}</span><span>${m.dist.toFixed(3)} m</span></div>`)
    .join('');
}

function projectToScreen(worldPos) {
  const v = worldPos.clone().project(camera);
  return {
    x: (v.x * 0.5 + 0.5) * window.innerWidth,
    y: (-v.y * 0.5 + 0.5) * window.innerHeight,
    visible: v.z < 1,
  };
}

function updateAllLabels() {
  for (const m of measurements) {
    const mid = m.a.clone().add(m.b).multiplyScalar(0.5);
    const p = projectToScreen(mid);
    m.label.style.left = p.x + 'px';
    m.label.style.top = p.y + 'px';
    m.label.style.display = p.visible ? 'block' : 'none';
  }
}

// ------------------------------------------------------------------
// 範囲削除選択機能（ドラッグで矩形選択→赤くハイライト→削除実行）
// ------------------------------------------------------------------
function setupDeleteSelection() {
  deleteModeBtn.addEventListener('click', () => {
    if (deleteMode) {
      exitDeleteMode();
    } else {
      if (measureMode) { measureBtn.click(); } // 測定モードとは排他
      deleteMode = true;
      deleteModeBtn.textContent = '🗑️ 範囲削除選択: ON';
      deleteModeBtn.classList.add('active');
      deleteHint.style.display = 'block';
      controls.enabled = false;
    }
  });

  deleteConfirmBtn.addEventListener('click', commitDeletion);
  deleteClearBtn.addEventListener('click', clearSelection);
  resetBtn.addEventListener('click', resetToOriginal);
  downloadBtn.addEventListener('click', downloadEditedPly);

  let dragStart = null;
  const dom = renderer.domElement;

  dom.addEventListener('pointerdown', (e) => {
    if (!deleteMode) return;
    dragStart = { x: e.clientX, y: e.clientY };
    selectionBox.style.left = e.clientX + 'px';
    selectionBox.style.top = e.clientY + 'px';
    selectionBox.style.width = '0px';
    selectionBox.style.height = '0px';
    selectionBox.style.display = 'block';
  });

  window.addEventListener('pointermove', (e) => {
    if (!deleteMode || !dragStart) return;
    const x0 = Math.min(dragStart.x, e.clientX);
    const y0 = Math.min(dragStart.y, e.clientY);
    const w = Math.abs(e.clientX - dragStart.x);
    const h = Math.abs(e.clientY - dragStart.y);
    selectionBox.style.left = x0 + 'px';
    selectionBox.style.top = y0 + 'px';
    selectionBox.style.width = w + 'px';
    selectionBox.style.height = h + 'px';
  });

  window.addEventListener('pointerup', (e) => {
    if (!deleteMode || !dragStart) return;
    const x0 = Math.min(dragStart.x, e.clientX);
    const y0 = Math.min(dragStart.y, e.clientY);
    const x1 = Math.max(dragStart.x, e.clientX);
    const y1 = Math.max(dragStart.y, e.clientY);
    dragStart = null;
    selectionBox.style.display = 'none';
    if (Math.abs(x1 - x0) < 3 || Math.abs(y1 - y0) < 3) return; // 誤クリック防止
    selectPointsInRect(x0, y0, x1, y1);
  });
}

function selectPointsInRect(x0, y0, x1, y1) {
  if (!pointCloud) return;
  const ndcX0 = (x0 / window.innerWidth) * 2 - 1;
  const ndcX1 = (x1 / window.innerWidth) * 2 - 1;
  const ndcY0 = -(y0 / window.innerHeight) * 2 + 1; // 上端 → 大きいNDC-y
  const ndcY1 = -(y1 / window.innerHeight) * 2 + 1; // 下端 → 小さいNDC-y
  const xMin = Math.min(ndcX0, ndcX1), xMax = Math.max(ndcX0, ndcX1);
  const yMin = Math.min(ndcY0, ndcY1), yMax = Math.max(ndcY0, ndcY1);

  const viewProj = new THREE.Matrix4().multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
  const pos = pointCloud.geometry.getAttribute('position').array;
  const n = pointCloud.geometry.getAttribute('position').count;
  const v = new THREE.Vector3();
  let newlySelected = 0;

  for (let i = 0; i < n; i++) {
    if (selectedMask[i]) continue;
    v.set(pos[i * 3], pos[i * 3 + 1], pos[i * 3 + 2]);
    v.applyMatrix4(viewProj);
    if (v.z > 1 || v.z < -1) continue; // カメラ視錐台の外（背後含む）
    if (v.x >= xMin && v.x <= xMax && v.y >= yMin && v.y <= yMax) {
      selectedMask[i] = 1;
      newlySelected++;
    }
  }

  if (newlySelected > 0) applyHighlight();
  updateDeleteCountUI();
}

function applyHighlight() {
  const colorAttr = pointCloud.geometry.getAttribute('color');
  const arr = colorAttr.array;
  const n = selectedMask.length;
  for (let i = 0; i < n; i++) {
    if (selectedMask[i]) {
      arr[i * 3] = 1.0; arr[i * 3 + 1] = 0.1; arr[i * 3 + 2] = 0.1;
    } else {
      arr[i * 3] = baseColors[i * 3];
      arr[i * 3 + 1] = baseColors[i * 3 + 1];
      arr[i * 3 + 2] = baseColors[i * 3 + 2];
    }
  }
  colorAttr.needsUpdate = true;
}

function updateDeleteCountUI() {
  const n = selectedMask ? selectedMask.reduce((a, b) => a + b, 0) : 0;
  deleteCount.textContent = `選択: ${n.toLocaleString()}点`;
  deleteRow.style.display = deleteMode ? 'flex' : 'none';
  deleteConfirmBtn.disabled = n === 0;
}

function clearSelection() {
  if (!selectedMask) return;
  selectedMask.fill(0);
  if (pointCloud) applyHighlight();
  updateDeleteCountUI();
}

function commitDeletion() {
  if (!pointCloud || !selectedMask) return;
  const totalSelected = selectedMask.reduce((a, b) => a + b, 0);
  if (totalSelected === 0) return;
  if (!confirm(`${totalSelected.toLocaleString()}点を削除します。よろしいですか？`)) return;

  const geometry = pointCloud.geometry;
  const posAttr = geometry.getAttribute('position');
  const oldN = posAttr.count;
  const newN = oldN - totalSelected;

  const newPos = new Float32Array(newN * 3);
  const newColor = new Float32Array(newN * 3);
  const newBase = new Float32Array(newN * 3);
  let j = 0;
  for (let i = 0; i < oldN; i++) {
    if (selectedMask[i]) continue;
    newPos[j * 3] = posAttr.array[i * 3];
    newPos[j * 3 + 1] = posAttr.array[i * 3 + 1];
    newPos[j * 3 + 2] = posAttr.array[i * 3 + 2];
    newColor[j * 3] = baseColors[i * 3];
    newColor[j * 3 + 1] = baseColors[i * 3 + 1];
    newColor[j * 3 + 2] = baseColors[i * 3 + 2];
    newBase[j * 3] = baseColors[i * 3];
    newBase[j * 3 + 1] = baseColors[i * 3 + 1];
    newBase[j * 3 + 2] = baseColors[i * 3 + 2];
    j++;
  }

  geometry.setAttribute('position', new THREE.BufferAttribute(newPos, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(newColor, 3));
  geometry.computeBoundingBox();
  geometry.computeBoundingSphere();

  baseColors = newBase;
  selectedMask = new Uint8Array(newN);

  pointInfo.textContent = `${originalLabel} (編集済み): ${newN.toLocaleString()} 点`;
  statsEl.textContent = `points: ${newN.toLocaleString()}`;
  updateDeleteCountUI();
}

function exitDeleteMode() {
  deleteMode = false;
  deleteModeBtn.textContent = '🗑️ 範囲削除選択: OFF';
  deleteModeBtn.classList.remove('active');
  deleteHint.style.display = 'none';
  deleteRow.style.display = 'none';
  selectionBox.style.display = 'none';
  if (controls) controls.enabled = true;
}

function resetToOriginal() {
  if (!originalBuffer) return;
  if (!confirm('編集内容を破棄して、最初に読み込んだ点群に戻します。よろしいですか？')) return;
  loadPlyArrayBuffer(originalBuffer.slice(0), originalLabel, false);
}

function downloadEditedPly() {
  if (!pointCloud) return;
  const geometry = pointCloud.geometry;
  const posAttr = geometry.getAttribute('position');
  const colorAttr = geometry.getAttribute('color');
  const n = posAttr.count;

  const header =
    'ply\n' +
    'format binary_little_endian 1.0\n' +
    `element vertex ${n}\n` +
    'property float x\n' +
    'property float y\n' +
    'property float z\n' +
    'property uchar red\n' +
    'property uchar green\n' +
    'property uchar blue\n' +
    'end_header\n';
  const headerBytes = new TextEncoder().encode(header);

  const recordSize = 12 + 3; // xyz(float32)*3 + rgb(uint8)*3
  const body = new ArrayBuffer(n * recordSize);
  const view = new DataView(body);
  for (let i = 0; i < n; i++) {
    const off = i * recordSize;
    view.setFloat32(off, posAttr.array[i * 3], true);
    view.setFloat32(off + 4, posAttr.array[i * 3 + 1], true);
    view.setFloat32(off + 8, posAttr.array[i * 3 + 2], true);
    view.setUint8(off + 12, Math.round(Math.min(1, Math.max(0, colorAttr.array[i * 3])) * 255));
    view.setUint8(off + 13, Math.round(Math.min(1, Math.max(0, colorAttr.array[i * 3 + 1])) * 255));
    view.setUint8(off + 14, Math.round(Math.min(1, Math.max(0, colorAttr.array[i * 3 + 2])) * 255));
  }

  const blob = new Blob([headerBytes, body], { type: 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'edited_higashiikuta.ply';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

initScene();
loadInitial();
</script>
